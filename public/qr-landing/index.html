<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>العربي فروت هاوس</title>
<meta name="description" content="العربي — بيت الفواكه والبوظة العربية. تواصل معنا على واتساب، إنستغرام وفيسبوك.">
<meta name="theme-color" content="#FFF9F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1611" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="assets/favicon.png">
<meta property="og:title" content="العربي فروت هاوس">
<meta property="og:description" content="بيت الفواكه والبوظة العربية">
<meta property="og:image" content="https://www.alarabyicecream.com/qr-landing/assets/logo.png">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;600;700&display=swap">

<style>
  /* ---- tokens: light is the base, both dark states redefine only these ---- */
  :root{
    --orange:#F2731C;
    --orange-deep:#D85F0E;
    --green:#0A6B37;
    --green-deep:#075229;
    --cream:#FFF9F0;
    --cream-2:#FDF1E1;
    --surface:#FFFFFF;
    --ink:#1D2A1F;
    --sage:#6F7C6B;
    --hairline:#EADFCE;
    --ring:rgba(242,115,28,.22);
    --shadow:0 1px 2px rgba(29,42,31,.05), 0 10px 24px -12px rgba(29,42,31,.14);
    --shadow-cta:0 8px 20px -8px rgba(216,95,14,.55);
    --glow-a:rgba(242,115,28,.30);
    --glow-b:rgba(10,107,55,.20);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#0E1611;
      --cream-2:#131E17;
      --surface:#1A251D;
      --ink:#F2EDE3;
      --sage:#9BAA97;
      --hairline:#2A3A2E;
      --ring:rgba(242,115,28,.30);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.7);
      --shadow-cta:0 8px 22px -10px rgba(242,115,28,.6);
      --glow-a:rgba(242,115,28,.20);
      --glow-b:rgba(10,107,55,.26);
    }
  }
  :root[data-theme="dark"]{
    --cream:#0E1611;
    --cream-2:#131E17;
    --surface:#1A251D;
    --ink:#F2EDE3;
    --sage:#9BAA97;
    --hairline:#2A3A2E;
    --ring:rgba(242,115,28,.30);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.7);
    --shadow-cta:0 8px 22px -10px rgba(242,115,28,.6);
    --glow-a:rgba(242,115,28,.20);
    --glow-b:rgba(10,107,55,.26);
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"Cairo","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:clamp(20px,5vw,48px) 18px calc(28px + env(safe-area-inset-bottom));
    position:relative;
    overflow-x:hidden;
  }

  /* ambient citrus glow — decorative only */
  .glow{position:fixed;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0}
  .glow--a{inline-size:340px;block-size:340px;background:var(--glow-a);top:-130px;inset-inline-end:-110px}
  .glow--b{inline-size:300px;block-size:300px;background:var(--glow-b);bottom:-140px;inset-inline-start:-120px}

  .page{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;gap:26px}

  /* ---- hero ---- */
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
  /* Round wreath logo: just inside the white circle, not touching the border. */
  .badge{
    inline-size:140px;block-size:140px;border-radius:50%;
    background:#FFFFFF;
    display:grid;place-items:center;
    overflow:hidden;
    padding:7px;
    box-shadow:0 0 0 1px var(--ring), 0 0 0 8px color-mix(in srgb, var(--orange) 8%, transparent), var(--shadow);
  }
  .badge img{width:100%;height:100%;object-fit:contain;display:block}

  /* Modifier for the wide wordmark logo, which needs more breathing room. */
  .badge--wordmark{padding:20px}

  h1{
    font-family:"Baloo Bhaijaan 2","Cairo",sans-serif;
    font-weight:800;
    font-size:2.5rem;
    line-height:1.15;
    margin:6px 0 0;
    letter-spacing:-.01em;
    text-wrap:balance;
  }
  .tagline{
    margin:2px 0 0;
    /* explicit emoji fallback so 🏠🍧✨ render in color on every platform */
    font-family:"Cairo","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    font-size:1.0625rem;
    font-weight:600;
    line-height:1.6;
    color:var(--ink);
    opacity:.85;
    text-wrap:balance;
  }

  .marks{
    list-style:none;margin:10px 0 0;padding:0;
    display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
  }
  .marks li{
    font-size:.75rem;font-weight:700;color:var(--green);
    background:color-mix(in srgb, var(--green) 9%, var(--surface));
    border:1px solid color-mix(in srgb, var(--green) 18%, transparent);
    border-radius:999px;padding:4px 11px;
  }
  /* ---- primary CTA: ordering is the real action ---- */
  .cta{
    display:flex;align-items:center;gap:14px;
    text-decoration:none;color:#fff;
    background:linear-gradient(180deg,var(--orange),var(--orange-deep));
    border-radius:18px;padding:16px 18px;
    box-shadow:var(--shadow-cta);
    transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
  }
  .cta:hover{transform:translateY(-2px);filter:saturate(1.06)}
  .cta:active{transform:translateY(0) scale(.99)}
  .cta__icon{
    inline-size:44px;block-size:44px;flex:0 0 auto;border-radius:13px;
    background:rgba(255,255,255,.18);display:grid;place-items:center;
  }
  .cta__icon svg{inline-size:24px;block-size:24px;fill:#fff}
  .cta__text{display:flex;flex-direction:column;gap:1px;min-width:0}
  .cta__ar{font-family:"Baloo Bhaijaan 2","Cairo",sans-serif;font-weight:700;font-size:1.125rem;line-height:1.25}
  .cta__en{font-size:.6875rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.82;direction:ltr;text-align:start}
  .cta__arrow{margin-inline-start:auto;flex:0 0 auto;inline-size:18px;block-size:18px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}

  /* ---- secondary link rows: quieter, one list object ---- */
  .rows{display:flex;flex-direction:column;gap:10px}
  .row{
    display:flex;align-items:center;gap:14px;
    text-decoration:none;color:var(--ink);
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:16px;padding:12px 14px;
    box-shadow:var(--shadow);
    transition:transform .16s ease, border-color .16s ease;
  }
  .row:hover{transform:translateY(-2px);border-color:color-mix(in srgb, var(--orange) 45%, var(--hairline))}
  .row:active{transform:translateY(0) scale(.995)}
  .row__icon{
    inline-size:42px;block-size:42px;flex:0 0 auto;border-radius:12px;
    display:grid;place-items:center;
  }
  .row__icon svg{inline-size:22px;block-size:22px;fill:#fff}
  .row__icon--ig{background:linear-gradient(135deg,#FEBB3F 0%,#E4405F 48%,#8A3AB9 100%)}
  .row__icon--fb{background:#1877F2}
  .row__icon--web{background:linear-gradient(160deg,var(--green),var(--green-deep))}
  .row__text{display:flex;flex-direction:column;gap:0;min-width:0}
  .row__ar{font-family:"Baloo Bhaijaan 2","Cairo",sans-serif;font-weight:700;font-size:1.0625rem;line-height:1.3}
  .row__en{font-size:.6875rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);direction:ltr;text-align:start}
  .row__arrow{margin-inline-start:auto;flex:0 0 auto;inline-size:16px;block-size:16px;fill:none;stroke:var(--sage);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* arrows point the reading direction (RTL: to the left) */
  [dir="rtl"] .cta__arrow,[dir="rtl"] .row__arrow{transform:scaleX(-1)}

  /* ---- menu slot (real content drops in here later) ---- */
  .menu{
    background:var(--cream-2);
    border:1px solid var(--hairline);
    border-radius:16px;
    padding:16px 18px;
    text-align:center;
  }
  .menu__eyebrow{
    margin:0;font-size:.6875rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--orange);direction:ltr;
  }
  .menu__title{font-family:"Baloo Bhaijaan 2","Cairo",sans-serif;font-weight:700;font-size:1.125rem;margin:6px 0 2px}
  .menu__note{margin:0;font-size:.8125rem;color:var(--sage)}

  footer{text-align:center;font-size:.75rem;color:var(--sage);margin-top:2px}
  footer p{margin:0}

  a:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:18px}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
